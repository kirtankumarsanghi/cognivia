<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cogniva Demo Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #030303;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 50px -10px rgba(0,0,0,0.8);
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-align: center;
        }
        p {
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        button {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .student-btn {
            background: linear-gradient(135deg, #e84040, #c02020);
            color: #fff;
        }
        .educator-btn {
            background: rgba(232, 64, 64, 0.1);
            color: #e84040;
            border: 1px solid rgba(232, 64, 64, 0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(232, 64, 64, 0.3);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            background: rgba(232, 64, 64, 0.1);
            border: 1px solid rgba(232, 64, 64, 0.3);
            color: #e84040;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .success {
            background: rgba(52, 199, 89, 0.1);
            border: 1px solid rgba(52, 199, 89, 0.3);
            color: #34c759;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Cogniva</h1>
        <p>Demo Login - Choose your role</p>
        
        <div id="message"></div>
        
        <div class="button-group">
            <button class="student-btn" onclick="login('student')" id="studentBtn">
                👤 Login as Student
            </button>
            <button class="educator-btn" onclick="login('educator')" id="educatorBtn">
                🎓 Login as Educator
            </button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const supabase = createClient(
            'https://cbqswhmpdbojubljyinv.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNicXN3aG1wZGJvamnVibGp5aW52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzQ3MTc2NDQsImV4cCI6MjA1MDI5MzY0NH0.bpxQMJZv3YsKI9h-F_MltyxD_BXJ9E63gJX0_kqvjhg'
        );

        const accounts = {
            student: { email: 'student_demo@cognivia.com', password: 'password123!' },
            educator: { email: 'educator_demo@cognivia.com', password: 'password123!' }
        };

        window.login = async function(role) {
            const studentBtn = document.getElementById('studentBtn');
            const educatorBtn = document.getElementById('educatorBtn');
            const messageDiv = document.getElementById('message');
            
            // Disable buttons
            studentBtn.disabled = true;
            educatorBtn.disabled = true;
            
            // Show loading
            messageDiv.innerHTML = '<div class="success"><div class="spinner" style="margin: 0 auto;"></div><br/>Signing in...</div>';
            
            try {
                const { email, password } = accounts[role];
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    throw error;
                }

                messageDiv.innerHTML = '<div class="success">✓ Login successful! Redirecting...</div>';
                
                // Redirect to the app
                setTimeout(() => {
                    window.location.href = role === 'student' ? '/dashboard' : '/educator';
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                messageDiv.innerHTML = '<div class="error">❌ Login failed: ' + error.message + '</div>';
                
                // Re-enable buttons
                studentBtn.disabled = false;
                educatorBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
